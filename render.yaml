services:
  # 1) Webhook server (Click/Uzum Pay POST so'rovlarini qabul qiladi)
  - type: web
    name: yangibot-webhook
    runtime: python
    plan: free
    region: frankfurt
    rootDir: bot
    buildCommand: pip install -r ../requirements.txt
    startCommand: python webhook.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: PORT
        value: "10000"
      - key: BOT_TOKEN
        sync: false
      - key: GROUP_ID
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: CLICK_MERCHANT_ID
        sync: false
      - key: CLICK_SERVICE_ID
        sync: false
      - key: CLICK_MERCHANT_USER_ID
        sync: false
      - key: CLICK_SECRET_KEY
        sync: false
      - key: UZUM_MERCHANT_ID
        sync: false
      - key: UZUM_SERVICE_ID
        sync: false
      - key: UZUM_API_KEY
        sync: false
      - key: PAYMENT_RETURN_URL
        sync: false

  # 2) Bot (polling rejimida)
  - type: worker
    name: yangibot-bot
    runtime: python
    plan: free
    region: frankfurt
    rootDir: bot
    buildCommand: pip install -r ../requirements.txt && playwright install --with-deps chromium
    startCommand: python main.py
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: BOT_TOKEN
        sync: false
      - key: GROUP_ID
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: CLICK_MERCHANT_ID
        sync: false
      - key: CLICK_SERVICE_ID
        sync: false
      - key: CLICK_MERCHANT_USER_ID
        sync: false
      - key: CLICK_SECRET_KEY
        sync: false
      - key: UZUM_MERCHANT_ID
        sync: false
      - key: UZUM_SERVICE_ID
        sync: false
      - key: UZUM_API_KEY
        sync: false
      - key: PAYMENT_RETURN_URL
        sync: false
